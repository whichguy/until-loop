name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Check generated packages
        run: python3 scripts/sync_plugin_views.py --check
      - name: Run deterministic package suite
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: bash tests/until-loop.test.sh
